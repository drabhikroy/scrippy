<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root { color-scheme: light dark; --text: #1d1d1f; --muted: #5b5b60; }
@media (prefers-color-scheme: dark) { :root { --text: #f5f5f7; --muted: #b8b8bd; } }
body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); margin: 4px 18px 18px; }
h1 { font-size: 22px; margin: 6px 0 8px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
</style>
</head>
<body>
<h1>Scrippy is removed</h1>
<p>Scrippy and its Quick Actions are gone from your account. Your images and the copies Scrippy made are where you left them.</p>
<p class="muted">Thank you for trying Scrippy. To install it again, download the latest version from github.com/drabhikroy/scrippy.</p>
</body>
</html>
